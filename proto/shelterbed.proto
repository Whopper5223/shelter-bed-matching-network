syntax = "proto3";

package shelterbed.v1;

// Shared contract between intake-ingestion, matching-engine, and
// caseworker-gateway. This file is the one place bed/referral shapes are
// defined; every crate in the workspace generates its Rust types from it.

enum UnitType {
  UNIT_TYPE_UNSPECIFIED = 0;
  GENERAL = 1;
  FAMILY = 2;
  WOMENS_ONLY = 3;
  MENS_ONLY = 4;
  YOUTH = 5;
}

enum BedStatus {
  BED_STATUS_UNSPECIFIED = 0;
  AVAILABLE = 1;
  RESERVED = 2;
  OCCUPIED = 3;
  MAINTENANCE = 4;
}

enum ReferralStatus {
  REFERRAL_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  MATCHED = 2;
  EXPIRED = 3;
  CANCELLED = 4;
}

// A single check-in / check-out / maintenance-hold event from a shelter
// intake terminal. This is the payload published to the Kafka `bed-events`
// topic (protobuf-encoded bytes, keyed by shelter_id), and is also the body
// of the unary SubmitBedStatus RPC that intake-ingestion exposes.
message BedStatusEvent {
  string event_id = 1;       // UUID, used for idempotent apply on the consumer side
  string shelter_id = 2;
  string bed_id = 3;
  BedStatus status = 4;
  int64 sequence = 5;        // per-bed monotonic sequence assigned by the terminal
  int64 occurred_at_ms = 6;  // unix ms, set at the source for latency measurement
}

message SubmitBedStatusRequest {
  BedStatusEvent event = 1;
}

message SubmitBedStatusResponse {
  bool accepted = 1;
  string message = 2;
}

// Eligibility + priority inputs for a referral. Mirrors HUD Coordinated Entry
// prioritization: matching is ordered by vulnerability_score, not arrival
// order.
message ReferralCriteria {
  int32 family_size = 1;
  UnitType unit_type_required = 2;
  bool needs_pet_friendly = 3;
  bool needs_sobriety_free_environment = 4;
  bool needs_ada_accessible = 5;
  int32 vulnerability_score = 6; // higher = more vulnerable = higher priority
}

message SubmitReferralRequest {
  string caseworker_id = 1;
  string region = 2;
  ReferralCriteria criteria = 3;
}

message BedRef {
  string bed_id = 1;
  string shelter_id = 2;
}

message SubmitReferralResponse {
  string referral_id = 1;
  ReferralStatus status = 2;
  BedRef matched_bed = 3; // unset unless status == MATCHED
}

message AvailabilitySubscribeRequest {
  string region = 1;
}

message BedAvailabilityUpdate {
  string shelter_id = 1;
  string bed_id = 2;
  BedStatus status = 3;
  int64 available_count_in_region = 4;
  int64 event_timestamp_ms = 5;     // when the underlying event occurred at the source
  int64 delivered_timestamp_ms = 6; // when this update left the server, for e2e latency
  string region = 7;
}

// Hosted by intake-ingestion. Shelter intake terminals call this directly.
service IntakeService {
  rpc SubmitBedStatus(SubmitBedStatusRequest) returns (SubmitBedStatusResponse);
}

// Hosted by matching-engine. Internal service; caseworker-gateway is its
// only client. Kept separate from CaseworkerService so the engine can be
// scaled and secured independently of the public-facing gateway.
service MatchingService {
  rpc MatchReferral(SubmitReferralRequest) returns (SubmitReferralResponse);
  rpc StreamAvailability(AvailabilitySubscribeRequest) returns (stream BedAvailabilityUpdate);
}

// Hosted by caseworker-gateway. Public-facing; thin proxy over MatchingService.
service CaseworkerService {
  rpc SubmitReferral(SubmitReferralRequest) returns (SubmitReferralResponse);
  rpc StreamAvailability(AvailabilitySubscribeRequest) returns (stream BedAvailabilityUpdate);
}
