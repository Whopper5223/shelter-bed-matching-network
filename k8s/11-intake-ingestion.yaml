apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-ingestion
  namespace: shelterbed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intake-ingestion
  template:
    metadata:
      labels:
        app: intake-ingestion
    spec:
      containers:
        - name: intake-ingestion
          image: resproj-intake-ingestion:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50052
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: shelterbed-config
                  key: KAFKA_TOPIC
            - name: GRPC_ADDR
              value: "0.0.0.0:50052"
            - name: RUST_LOG
              value: "info"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: intake-ingestion
  namespace: shelterbed
spec:
  selector:
    app: intake-ingestion
  ports:
    - port: 50052
      targetPort: 50052
---
# Ingestion is the one service the architecture calls out as bursty (one
# intake terminal fleet per region/shelter network), so it's the one with
# its own HPA -- independent scaling for the component that actually needs
# it, rather than every service getting one by default. Requires
# metrics-server in the cluster to actually act; the manifest still applies
# and is inert without it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intake-ingestion
  namespace: shelterbed
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intake-ingestion
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
