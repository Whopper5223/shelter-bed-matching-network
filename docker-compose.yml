services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shelterbed
      POSTGRES_PASSWORD: shelterbed
      POSTGRES_DB: shelterbed
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelterbed"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      CLUSTER_ID: "shelterbed-dev-cluster-id-01"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  matching-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: matching-engine
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://shelterbed:shelterbed@postgres:5432/shelterbed"
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_TOPIC: "bed-events"
      KAFKA_GROUP_ID: "matching-engine"
      GRPC_ADDR: "0.0.0.0:50051"
      RUST_LOG: "info"
    ports:
      - "50051:50051"

  intake-ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: intake-ingestion
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:19092"
      KAFKA_TOPIC: "bed-events"
      GRPC_ADDR: "0.0.0.0:50052"
      RUST_LOG: "info"
    ports:
      - "50052:50052"

  caseworker-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: caseworker-gateway
    depends_on:
      - matching-engine
    environment:
      MATCHING_ENGINE_ADDR: "http://matching-engine:50051"
      GRPC_ADDR: "0.0.0.0:50053"
      RUST_LOG: "info"
    ports:
      - "50053:50053"

  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: simulator
    depends_on:
      - intake-ingestion
      - caseworker-gateway
    environment:
      DATABASE_URL: "postgres://shelterbed:shelterbed@postgres:5432/shelterbed"
      INTAKE_ADDR: "http://intake-ingestion:50052"
      GATEWAY_ADDR: "http://caseworker-gateway:50053"
      NUM_SHELTERS: "12"
      BEDS_PER_SHELTER: "8"
      SIMULATION_SECONDS: "30"
      RUST_LOG: "info"
    restart: "no"

volumes:
  pgdata:
